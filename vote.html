<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ψηφοφορία - Σχολική Τηλεματική</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --accent: #3b82f6;
            --text: #f8fafc;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1.5rem;
            text-align: center;
        }
        .container {
            width: 100%;
            max-width: 450px;
            background: var(--card);
            padding: 2rem;
            border-radius: 1.5rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.05);
        }
        h1 { font-size: 1.5rem; margin-bottom: 1.5rem; line-height: 1.3; }
        .options-list { display: flex; flex-direction: column; gap: 1rem; margin-top: 1rem; }
        .option-btn {
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(255,255,255,0.1);
            color: white;
            padding: 1.2rem;
            border-radius: 1rem;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .option-btn:hover { border-color: var(--accent); background: rgba(59, 130, 246, 0.1); }
        .option-btn:active { transform: scale(0.98); }
        .option-btn.selected { background: var(--accent); border-color: var(--accent); }
        
        .status-msg { margin-top: 2rem; font-size: 0.9rem; opacity: 0.7; }
        .success-icon { font-size: 3rem; color: #22c55e; margin-bottom: 1rem; }
        
        #loader { border: 4px solid #f3f3f3; border-top: 4px solid var(--accent); border-radius: 50%; width: 30px; height: 30px; animation: spin 2s linear infinite; margin: 2rem auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="app" class="container">
        <div id="loader"></div>
        <p>Φόρτωση ψηφοφορίας...</p>
    </div>

    <script type="module">
        import { db, doc, onSnapshot, collection, addDoc, query, where, getDocs } from "./firebase-config.js";

        const urlParams = new URLSearchParams(window.location.search);
        const pollId = urlParams.get('id');
        const app = document.getElementById('app');

        if (!pollId) {
            app.innerHTML = "<h1>❌ Σφάλμα</h1><p>Δεν βρέθηκε η ψηφοφορία.</p>";
        } else {
            initVote();
        }

        async function initVote() {
            // Check if already voted on this device
            const hasVoted = localStorage.getItem('voted_' + pollId);
            if (hasVoted) {
                showSuccess();
                return;
            }

            // Get poll data
            onSnapshot(doc(db, "announcements", pollId), (docSnap) => {
                if (!docSnap.exists()) {
                    app.innerHTML = "<h1>❌ Σφάλμα</h1><p>Η ψηφοφορία δεν υπάρχει πλέον.</p>";
                    return;
                }

                const data = docSnap.data();
                if (data.mediaType !== 'poll') {
                    app.innerHTML = "<h1>❌ Σφάλμα</h1><p>Το στοιχείο δεν είναι ψηφοφορία.</p>";
                    return;
                }

                let options = [];
                try {
                    options = JSON.parse(data.extraData);
                } catch(e) { options = []; }

                renderPoll(data.mediaSource, options);
            });
        }

        function renderPoll(question, options) {
            let html = `<h1>${question}</h1><div class="options-list">`;
            options.forEach((opt, index) => {
                html += `<button class="option-btn" onclick="submitVote(${index})">
                            <span>${opt}</span>
                            <span style="opacity:0.3">➔</span>
                        </button>`;
            });
            html += `</div><p class="status-msg">Επίλεξε μία από τις παραπάνω απαντήσεις.</p>`;
            app.innerHTML = html;

            // Manual binding because of module scope
            window.submitVote = async (index) => {
                const btns = document.querySelectorAll('.option-btn');
                btns.forEach(b => b.disabled = true);
                btns[index].classList.add('selected');

                try {
                    await addDoc(collection(db, "votes"), {
                        pollId: pollId,
                        optionIndex: index,
                        timestamp: new Date().toISOString()
                    });
                    localStorage.setItem('voted_' + pollId, 'true');
                    showSuccess();
                } catch (err) {
                    alert("Σφάλμα κατά την αποστολή: " + err.message);
                    btns.forEach(b => b.disabled = false);
                }
            };
        }

        function showSuccess() {
            app.innerHTML = `
                <div class="success-icon">✓</div>
                <h1>Ευχαριστούμε!</h1>
                <p>Η ψήφος σου καταγράφηκε με επιτυχία.</p>
                <div style="margin-top:2rem; font-size:0.8rem; opacity:0.5;">
                    Δες τα αποτελέσματα στην οθόνη του σχολείου!
                </div>
            `;
        }
    </script>
</body>
</html>
