                    : null;
                if (req && typeof req.catch === 'function') {
                    req.catch(() => {});
                }
            } catch (e) {}

            const overlay = document.getElementById('fullscreenOverlay');
            if (overlay) overlay.style.display = 'none';

            if (window.__keepAwake) {
                window.__keepAwake.activate(true);
            }
        }

        function showFullscreenOverlay() {
            const overlay = document.getElementById('fullscreenOverlay');
            if (!overlay) return;
            overlay.style.display = 'flex';
            try {
                overlay.focus({ preventScroll: true });
            } catch (e) {}
        }

        // Allow TV remote OK/Enter or Space key to dismiss overlay and start Keep-Awake
        document.addEventListener('keydown', (e) => {
            const overlay = document.getElementById('fullscreenOverlay');
            if (overlay && overlay.style.display === 'flex' && (e.key === 'Enter' || e.key === ' ' || e.keyCode === 13)) {
                enterFullscreen();
            }
        });

        // Show overlay only on large screens (likely a TV / projector)
        if (window.screen.width >= 1200 || window.innerWidth >= 1200) {
            // Small delay so the page loads first
            setTimeout(showFullscreenOverlay, 800);
        }

        // Re-show overlay if user presses ESC (exits fullscreen)
        ['fullscreenchange', 'webkitfullscreenchange'].forEach((evt) => {
            document.addEventListener(evt, () => {
                if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                    if (window.innerWidth >= 1200) {
                        setTimeout(showFullscreenOverlay, 500);
                    }
                }
            });
        });
    </script>
