<!DOCTYPE html>
<html lang="el">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Telematics - Οθόνη Προβολής</title>
    <link rel="stylesheet" href="style.css?v=2026_DIRECTOR_TICKER_V3">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body style="overflow: hidden;">
    <canvas id="themeCanvas"
        style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5;"></canvas>
    <div class="display-container">
        <header class="display-header">
            <div class="header-left">
                <img id="schoolLogo" src="logo.png" alt="School Logo" class="logo">
                <div>
                    <div id="schoolNameDisplay" style="font-weight: 800; font-size: 1.6rem; letter-spacing: -0.02em; color: white;">ΣΧΟΛΙΚΕΣ ΕΝΗΜΕΡΩΣΕΙΣ</div>
                    <div id="date" style="color: var(--text-secondary); font-size: 0.95rem; font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px;"></div>
                    <div id="schoolScheduleStatus"></div>
                </div>
            </div>
            <div class="header-right">
                <div id="weather">
                    <!-- Weather injected via JS -->
                </div>
                <div id="clock" class="clock">00:00</div>
            </div>
        </header>

        <!-- Banner Container -->
        <div id="bannerContainer" class="banner-container" style="display: none;"></div>

        <main id="slideContainer" class="display-content">
            <!-- Slides will be injected here -->
            <div class="loading">Σύνδεση στο Cloud (RESTORE)...</div>
        </main>

        <div id="tickerContainer" class="ticker-container" style="display: none;">
            <div class="ticker-label">ΔΙΕΥΘΥΝΣΗ</div>
            <div id="tickerContent" class="ticker-content"></div>
        </div>
    </div>

    <!-- MAIN SCRIPT CLOUD VERSION (MODULE) -->
    <script type="module" src="script-display.js?v=2026_DIRECTOR_TICKER_V3"></script>

    <style>
        /* Fix for banner - full width */
        .banner-container {
            width: 100% !important;
            display: block !important;
        }

        .banner-image {
            width: 100% !important;
            max-height: 150px !important;
            display: block !important;
        }

        /* Fix for oversized images and iframes in slides - Use full container height */
        .slide-image {
            max-width: 100% !important;
            height: 100% !important;
            width: auto !important;
            object-fit: contain !important;
        }

        .slide-iframe {
            width: 100%;
            height: 100%;
        }

        embed {
            width: 100% !important;
            height: 100% !important;
        }
    </style>

    <!-- FullScreen Overlay (Large Screen Only) -->
    <div id="fullscreenOverlay" style="
        display: none;
        position: fixed; inset: 0; z-index: 99999;
        background: rgba(0,0,0,0.85);
        backdrop-filter: blur(6px);
        flex-direction: column;
        align-items: center; justify-content: center;
        cursor: pointer;
        animation: fadeInOverlay 0.5s ease;
    " onclick="enterFullscreen()">
        <div style="font-size: 5rem; margin-bottom: 1rem;">📺</div>
        <div style="
            color: white; font-family: 'Inter', sans-serif;
            font-size: 2rem; font-weight: 700; text-align: center;
            margin-bottom: 0.5rem;
        ">Κλικ για Πλήρη Οθόνη</div>
        <div style="color: rgba(255,255,255,0.6); font-size: 1.1rem; font-family: sans-serif;">
            Ανιχνεύθηκε μεγάλη οθόνη
        </div>
        <div style="
            margin-top: 2rem;
            background: #3b82f6; color: white;
            padding: 0.8rem 2.5rem; border-radius: 2rem;
            font-size: 1.2rem; font-weight: 600;
            box-shadow: 0 0 30px rgba(59,130,246,0.5);
            animation: pulse 1.5s ease-in-out infinite;
        ">▶ Έναρξη</div>
    </div>

    <style>
        @keyframes fadeInOverlay {
            from { opacity: 0; }
            to   { opacity: 1; }
        }
    </style>

    <script>
        function enterFullscreen() {
            const el = document.documentElement;
            if (el.requestFullscreen)           el.requestFullscreen();
            else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
            else if (el.mozRequestFullScreen)    el.mozRequestFullScreen();
            else if (el.msRequestFullscreen)     el.msRequestFullscreen();
            document.getElementById('fullscreenOverlay').style.display = 'none';
        }

        function showFullscreenOverlay() {
            document.getElementById('fullscreenOverlay').style.display = 'flex';
        }

        // Show overlay only on large screens (likely a TV / projector)
        if (window.screen.width >= 1200 || window.innerWidth >= 1200) {
            // Small delay so the page loads first
            setTimeout(showFullscreenOverlay, 800);
        }

        // Re-show overlay if user presses ESC (exits fullscreen)
        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) {
                // Only if large screen
                if (window.innerWidth >= 1200) {
                    setTimeout(showFullscreenOverlay, 500);
                }
            }
        });
    </script>

    <div
        style="position: fixed; bottom: 74px; right: 15px; z-index: 50000; font-size: 0.8rem; color: rgba(255,255,255,0.7); text-shadow: 1px 1px 2px rgba(0,0,0,0.8); pointer-events: none; font-weight: bold;">
        ΚΑΤΑΣΚΕΥΗ: Ε. ΒΑΛΑΚΟΣ with Antigravity
    </div>
</body>

</html>
