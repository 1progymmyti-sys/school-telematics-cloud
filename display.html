<!DOCTYPE html>
<html lang="el">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Telematics - FIXED</title>
    <link rel="stylesheet" href="style.css?v=DASH_V3">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body class="dashboard-mode" style="overflow: hidden;">

    <canvas id="themeCanvas"
        style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5;"></canvas>
    
    <div class="dashboard-wrapper">
        <!-- Dashboard Main Stage -->
        <main id="slideContainer" class="main-stage">
            <div class="loading">Σύνδεση στο Cloud...</div>
        </main>

        <!-- Dashboard Sidebar -->
        <aside class="sidebar">
            <div style="text-align: center; padding: 1rem 0;">
                <img id="schoolLogo" src="logo.png" alt="Logo" style="height: 80px; max-width: 90%; object-fit: contain;">
                <div id="schoolNameDisplay" style="font-weight: 800; font-size: 1.2rem; color: var(--accent-color); margin-top: 0.5rem; text-transform: uppercase;">ΣΧΟΛΕΙΟ</div>
            </div>

            <!-- Clock & Date -->
            <div class="side-card clock-card">
                <div id="clock">00:00</div>
                <div id="date">ΦΟΡΤΩΣΗ...</div>
            </div>

            <!-- Weather -->
            <div class="side-card weather-card">
                <div id="weather">
                    <!-- Weather injected via JS -->
                </div>
            </div>

            <!-- Status (School Schedule) -->
            <div class="side-card status-card">
                <div class="card-header">
                    <span>ΚΑΤΑΣΤΑΣΗ ΣΧΟΛΕΙΟΥ</span>
                    <span>🔔</span>
                </div>
                <div id="schoolScheduleStatus">Φόρτωση προγράμματος...</div>
            </div>

            <!-- Upcoming Events -->
            <div class="side-card upcoming-card">
                <div class="card-header" style="border-bottom: 2px solid var(--accent-color); padding-bottom: 0.8rem; margin-bottom: 1.5rem;">
                    <span style="display: flex; align-items: center; gap: 0.8rem;">📅 ΕΠΟΜΕΝΕΣ ΑΝΑΚΟΙΝΩΣΕΙΣ</span>
                </div>
                <div id="upcomingEvents">
                    <!-- Event items will be injected here with date blocks -->
                </div>
            </div>
        </aside>

        <!-- Banner Container -->
        <div id="bannerContainer" class="banner-container" style="display: none;"></div>

        <!-- Ticker -->
        <div id="tickerContainer" class="ticker-container" style="display: none;">
            <div class="ticker-label" style="background: transparent; color: #fbbf24; font-weight: 900; font-size: 1.1rem; padding-right: 0.5rem;">SCHOOL NEWS TICKER:</div>
            <div id="tickerContent" class="ticker-content" style="color: white; font-weight: 500;"></div>
        </div>
    </div>

    <!-- MAIN SCRIPT CLOUD VERSION (MODULE) -->
    <script type="module" src="script-display.js?v=dashboard_v1"></script>

    <style>
        /* Essential Overrides only */
        embed {
            width: 100% !important;
            height: 100% !important;
        }
    </style>



    <!-- FullScreen Overlay (Large Screen Only) -->
    <div id="fullscreenOverlay" style="
        display: none;
        position: fixed; inset: 0; z-index: 99999;
        background: rgba(0,0,0,0.85);
        backdrop-filter: blur(6px);
        flex-direction: column;
        align-items: center; justify-content: center;
        cursor: pointer;
        animation: fadeInOverlay 0.5s ease;
    " onclick="enterFullscreen()">
        <div style="font-size: 5rem; margin-bottom: 1rem;">📺</div>
        <div style="
            color: white; font-family: 'Inter', sans-serif;
            font-size: 2rem; font-weight: 700; text-align: center;
            margin-bottom: 0.5rem;
        ">Κλικ για Πλήρη Οθόνη</div>
        <div style="color: rgba(255,255,255,0.6); font-size: 1.1rem; font-family: sans-serif;">
            Ανιχνεύθηκε μεγάλη οθόνη
        </div>
        <div style="
            margin-top: 2rem;
            background: #3b82f6; color: white;
            padding: 0.8rem 2.5rem; border-radius: 2rem;
            font-size: 1.2rem; font-weight: 600;
            box-shadow: 0 0 30px rgba(59,130,246,0.5);
            animation: pulse 1.5s ease-in-out infinite;
        ">▶ Έναρξη</div>
    </div>

    <style>
        @keyframes fadeInOverlay {
            from { opacity: 0; }
            to   { opacity: 1; }
        }
    </style>

    <script>
        function enterFullscreen() {
            const el = document.documentElement;
            if (el.requestFullscreen)           el.requestFullscreen();
            else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
            else if (el.mozRequestFullScreen)    el.mozRequestFullScreen();
            else if (el.msRequestFullscreen)     el.msRequestFullscreen();
            document.getElementById('fullscreenOverlay').style.display = 'none';
        }

        function showFullscreenOverlay() {
            document.getElementById('fullscreenOverlay').style.display = 'flex';
        }

        // Show overlay only on large screens (likely a TV / projector)
        if (window.screen.width >= 1200 || window.innerWidth >= 1200) {
            // Small delay so the page loads first
            setTimeout(showFullscreenOverlay, 800);
        }

        // Re-show overlay if user presses ESC (exits fullscreen)
        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) {
                // Only if large screen
                if (window.innerWidth >= 1200) {
                    setTimeout(showFullscreenOverlay, 500);
                }
            }
        });
    </script>

    <div
        style="position: fixed; bottom: 5px; right: 10px; z-index: 50000; font-size: 0.85rem; color: rgba(255,255,255,0.8); text-shadow: 1px 1px 2px rgba(0,0,0,0.8); pointer-events: none; font-weight: bold;">
        ΚΑΤΑΣΚΕΥΗ: Ε. ΒΑΛΑΚΟΣ with Antigravity
    </div>
</body>

</html>
