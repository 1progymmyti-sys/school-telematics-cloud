<!DOCTYPE html>
<html lang="el">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>School Telematics - FIXED</title>
    <link rel="stylesheet" href="style.css?v=UNDER_CLOCK">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body style="overflow: hidden;">
    <canvas id="themeCanvas"
        style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5;"></canvas>
    <div class="display-container">
        <header class="display-header">
            <div class="header-left">
                <img id="schoolLogo" src="logo.png" alt="School Logo" class="school-logo">
                <div class="display-info">
                    <div id="schoolNameDisplay" class="school-name-header">ΣΧΟΛΙΚΕΣ ΕΝΗΜΕΡΩΣΕΙΣ</div>
                    <div class="header-status-row">
                        <div id="date" class="date-display"></div>
                        <div id="schoolScheduleStatus" class="schedule-badge">---</div>
                    </div>
                </div>
            </div>
            <div id="headerProgressBar" class="header-progress"></div>
            <div class="header-right" style="display: flex; flex-direction: column; align-items: flex-end; justify-content: center; gap: 0.2rem; line-height: 1;">
                <div id="clock" class="clock">00:00</div>
                <div id="weather" style="display: flex; align-items: center; gap: 0.5rem; color: var(--text-primary); font-size: 1.4rem; opacity: 0.9; font-weight: 500;">
                </div>
            </div>
        </header>

        <!-- Banner Container -->
        <div id="bannerContainer" class="banner-container" style="display: none;"></div>

        <main id="slideContainer" class="display-content">
            <!-- Slides will be injected here -->
            <div class="loading">Σύνδεση στο Cloud (RESTORE)...</div>
        </main>

        <div id="tickerContainer" class="ticker-container" style="display: none;">
            <div class="ticker-label">ΔΙΕΥΘΥΝΣΗ</div>
            <div id="tickerContent" class="ticker-content"></div>
        </div>
    </div>

    <!-- MAIN SCRIPT CLOUD VERSION (MODULE) -->
    <script type="module" src="script-display.js?v=V3_WEEKLY_FINAL"></script>

    <style>
        /* Fix for banner - full width */
        .banner-container {
            width: 100% !important;
            display: block !important;
        }

        .banner-image {
            width: 100% !important;
            max-height: 150px !important;
            display: block !important;
        }

        /* Fix for oversized images and iframes in slides - Use full container height */
        .slide-image {
            max-width: 100% !important;
            height: 100% !important;
            width: auto !important;
            object-fit: contain !important;
        }

        .slide-iframe {
            width: 100%;
            height: 100%;
        }

        embed {
            width: 100% !important;
            height: 100% !important;
        }
    </style>
    <style>
        /* REMOVED DUPLICATE INLINE OVERRIDES - Now handled in style.css */

        /* Hide original header content partially if needed, but keep logo */
    </style>
    </style>

    <!-- FullScreen Overlay (Large Screen Only) -->
    <div id="fullscreenOverlay" style="
        display: none;
        position: fixed; inset: 0; z-index: 99999;
        background: rgba(0,0,0,0.85);
        backdrop-filter: blur(6px);
        flex-direction: column;
        align-items: center; justify-content: center;
        cursor: pointer;
        animation: fadeInOverlay 0.5s ease;
    " onclick="enterFullscreen()">
        <div style="font-size: 5rem; margin-bottom: 1rem;">📺</div>
        <div style="
            color: white; font-family: 'Inter', sans-serif;
            font-size: 2rem; font-weight: 700; text-align: center;
            margin-bottom: 0.5rem;
        ">Κλικ για Πλήρη Οθόνη</div>
        <div style="color: rgba(255,255,255,0.6); font-size: 1.1rem; font-family: sans-serif;">
            Ανιχνεύθηκε μεγάλη οθόνη
        </div>
        <div style="
            margin-top: 2rem;
            background: #3b82f6; color: white;
            padding: 0.8rem 2.5rem; border-radius: 2rem;
            font-size: 1.2rem; font-weight: 600;
            box-shadow: 0 0 30px rgba(59,130,246,0.5);
            animation: pulse 1.5s ease-in-out infinite;
        ">▶ Έναρξη</div>
    </div>

    <style>
        @keyframes fadeInOverlay {
            from { opacity: 0; }
            to   { opacity: 1; }
        }
    </style>

    <script>
        function enterFullscreen() {
            const el = document.documentElement;
            if (el.requestFullscreen)           el.requestFullscreen();
            else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
            else if (el.mozRequestFullScreen)    el.mozRequestFullScreen();
            else if (el.msRequestFullscreen)     el.msRequestFullscreen();
            document.getElementById('fullscreenOverlay').style.display = 'none';
        }

        function showFullscreenOverlay() {
            document.getElementById('fullscreenOverlay').style.display = 'flex';
        }

        // Show overlay only on large screens (likely a TV / projector)
        if (window.screen.width >= 1200 || window.innerWidth >= 1200) {
            // Small delay so the page loads first
            setTimeout(showFullscreenOverlay, 800);
        }

        // Re-show overlay if user presses ESC (exits fullscreen)
        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) {
                // Only if large screen
                if (window.innerWidth >= 1200) {
                    setTimeout(showFullscreenOverlay, 500);
                }
            }
        });

        /**
         * UNIVERSAL SCALE ENGINE
         * This script ensures that no matter the resolution of the TV, 
         * the design remains proportional and fills the screen correctly.
         */
        function adjustDisplayScaling() {
            const container = document.querySelector('.display-container');
            if (!container) return;

            // Design dimensions (Standard 1080p)
            const designW = 1920;
            const designH = 1080;
            
            const winW = window.innerWidth;
            const winH = window.innerHeight;
            
            // Calculate scale factors
            const scaleW = winW / designW;
            const scaleH = winH / designH;
            
            // For general layouts, we use vmin/vh in CSS.
            // But if the browser is extremely old and doesn't support them well,
            // we could force a body scale. For now, we'll just log and check for anomalies.
            console.log(`Resolution Detected: ${winW}x${winH} | Scale: ${scaleW.toFixed(2)}x`);
            
            // Force redrawing of specific elements that might get stuck
            const header = document.querySelector('.display-header');
            if (header) header.style.width = '100vw';
        }

        window.addEventListener('resize', adjustDisplayScaling);
        adjustDisplayScaling();
    </script>

    <div
        style="position: fixed; bottom: 8px; right: 15px; z-index: 50000; font-size: 0.95rem; color: rgba(255,255,255,0.7); text-shadow: 1px 1px 3px rgba(0,0,0,1); pointer-events: none; font-weight: 700; font-family: 'Inter', sans-serif;">
        ΚΑΤΑΣΚΕΥΗ: Ε. ΒΑΛΑΚΟΣ με το Antigravity
    </div>
</body>

</html>
